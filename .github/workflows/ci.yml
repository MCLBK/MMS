name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Show key versions
        run: python -c "import pydantic; import sqlalchemy; print(f'pydantic={pydantic.VERSION} sqlalchemy={sqlalchemy.__version__}')"

      - name: Check imports
        run: |
          python -c "
          import sys
          try:
              import src.main
              print('src.main imported OK')
          except Exception as e:
              print(f'::error::IMPORT FAILED: {type(e).__name__}: {e}', flush=True)
              sys.exit(1)
          "

      - name: Run tests
        run: |
          set +e
          pytest -v --tb=short 2>&1 | tee test-output.txt
          RESULT=${PIPESTATUS[0]}
          if [ $RESULT -ne 0 ]; then
            ERRLINE=$(grep -E "^(E |ERRORS|FAILED|ERROR|.*Error:|.*Exception:)" test-output.txt | tail -5 | tr '\n' ' /// ')
            echo "::error::TEST FAIL SUMMARY: $ERRLINE"
            echo "::error::LAST LINES: $(tail -5 test-output.txt | tr '\n' ' /// ')"
          fi
          exit $RESULT

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx next lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infrastructure/Dockerfile.backend -t mms-backend:test ./backend

      - name: Build frontend image
        run: docker build -f infrastructure/Dockerfile.frontend -t mms-frontend:test ./frontend-web
