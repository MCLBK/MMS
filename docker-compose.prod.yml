services:
  postgres:
    image: postgres:16-alpine
    container_name: mms_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mms_express}
      POSTGRES_USER: ${POSTGRES_USER:-mms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mms_user} -d ${POSTGRES_DB:-mms_express}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mms_network

  redis:
    image: redis:7-alpine
    container_name: mms_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mms_network

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile.backend
    container_name: mms_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mms_network

  frontend:
    build:
      context: ./frontend-web
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: mms_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: ""
    depends_on:
      - backend
    networks:
      - mms_network

  nginx:
    image: nginx:alpine
    container_name: mms_nginx
    restart: always
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mms_network

volumes:
  postgres_data:
  redis_data:

networks:
  mms_network:
    driver: bridge
